name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:                      # a throw-away real Postgres just for this run
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      GA4_HASH_KEY: ci-only-key-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the whole pipeline end to end
        run: |
          python -m src.apply_sql sql/01_schema.sql sql/02_views.sql
          python -m src.generate_events
          python -m src.load_events
          python -m src.export_ga4
      - name: Run all tests (boundary tests + database checks)
        run: python -m pytest -q
